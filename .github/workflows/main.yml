name: Expense Alert Scheduler

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expense-alert-check
  cancel-in-progress: false

jobs:
  check-expenses:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backgroundservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run expense alert check
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/checkExpenses.js
